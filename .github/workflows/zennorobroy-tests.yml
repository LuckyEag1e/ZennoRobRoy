name: zennorobroy tests

on:
  push:
    branches: [main]
    paths: ['zennorobroy/**', '.github/workflows/zennorobroy-tests.yml']
  pull_request:
    paths: ['zennorobroy/**', '.github/workflows/zennorobroy-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zennorobroy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zennorobroy/package-lock.json
      - run: npm ci
      - run: npm test
